<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coin Runner</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    background: #87CEEB;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ---------- Game constants ----------
  const GROUND_Y = H - 60;          // top of the ground
  const GRAVITY = 0.9;
  const JUMP_VELOCITY = -16;
  const BASE_SPEED = 6;
  const SPEED_INCREASE = 0.0008;    // per frame

  // ---------- Game state ----------
  let state;                        // 'ready' | 'playing' | 'over'
  let score, bestScore, speed, frame, spawnTimer, coinTimer;
  let coinsCollected;

  const player = {
    x: 100,
    y: GROUND_Y,
    w: 36,
    h: 48,
    vy: 0,
    onGround: true
  };

  let obstacles = [];
  let coins = [];
  let particles = [];

  // Persistent best score
  try { bestScore = parseInt(localStorage.getItem('coinRunnerBest')) || 0; }
  catch { bestScore = 0; }

  function reset() {
    state = 'ready';
    score = 0;
    speed = BASE_SPEED;
    frame = 0;
    spawnTimer = 0;
    coinTimer = 60;
    coinsCollected = 0;
    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;
    obstacles = [];
    coins = [];
    particles = [];
  }

  function startGame() {
    reset();
    state = 'playing';
  }

  // ---------- Input ----------
  function jump() {
    if (state === 'ready') { startGame(); return; }
    if (state === 'over') { startGame(); return; }
    if (player.onGround) {
      player.vy = JUMP_VELOCITY;
      player.onGround = false;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      jump();
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    jump();
  });

  // ---------- Spawning ----------
  function spawnObstacle() {
    const heights = [40, 60, 80];
    const h = heights[Math.floor(Math.random() * heights.length)];
    const w = 24 + Math.random() * 20;
    obstacles.push({
      x: W + 20,
      y: GROUND_Y - h,
      w,
      h,
      // small cactus / block look
      color: '#2d6a4f'
    });
  }

  function spawnCoin() {
    const patterns = [1, 1, 1, 3]; // sometimes a row of 3
    const count = patterns[Math.floor(Math.random() * patterns.length)];
    const baseY = GROUND_Y - 60 - Math.random() * 80;
    for (let i = 0; i < count; i++) {
      coins.push({
        x: W + 20 + i * 40,
        y: baseY,
        r: 10,
        collected: false,
        spin: 0
      });
    }
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: (Math.random() - 0.5) * 6 - 2,
        life: 1,
        color,
        size: 3 + Math.random() * 4
      });
    }
  }

  // ---------- Collision ----------
  function rectsOverlap(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
  }

  function circleRectOverlap(c, r) {
    const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
    const dx = c.x - cx;
    const dy = c.y - cy;
    return dx * dx + dy * dy < c.r * c.r;
  }

  // ---------- Update ----------
  function update() {
    if (state !== 'playing') return;

    frame++;
    speed = BASE_SPEED + frame * SPEED_INCREASE;

    // Player physics
    player.vy += GRAVITY;
    player.y += player.vy;

    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    }

    // Score from distance
    score += speed * 0.05;

    // Spawn obstacles
    spawnTimer -= 1;
    if (spawnTimer <= 0) {
      spawnObstacle();
      const gap = Math.max(50, 100 - frame * 0.05);
      spawnTimer = gap + Math.random() * 60;
    }

    // Spawn coins
    coinTimer -= 1;
    if (coinTimer <= 0) {
      spawnCoin();
      coinTimer = 120 + Math.random() * 120;
    }

    // Move obstacles
    const playerRect = { x: player.x, y: player.y - player.h, w: player.w, h: player.h };

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;

      if (rectsOverlap(playerRect, o)) {
        // Game over
        state = 'over';
        spawnParticles(player.x + player.w / 2, player.y - player.h / 2, '#e63946');
        if (score > bestScore) {
          bestScore = Math.floor(score);
          try { localStorage.setItem('coinRunnerBest', bestScore); } catch {}
        }
        return;
      }

      if (o.x + o.w < -50) obstacles.splice(i, 1);
    }

    // Move coins
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.x -= speed;
      c.spin += 0.15;

      if (circleRectOverlap(c, playerRect)) {
        coinsCollected++;
        score += 25;
        spawnParticles(c.x, c.y, '#ffd60a');
        coins.splice(i, 1);
        continue;
      }

      if (c.x < -40) coins.splice(i, 1);
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ---------- Draw ----------
  function drawBackground() {
    // Sky gradient
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#a8dadc');
    grad.addColorStop(1, '#e0fbfc');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Parallax clouds
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    for (let i = 0; i < 3; i++) {
      const cx = ((frame * (0.2 + i * 0.1)) % (W + 200)) - 100;
      const cy = 60 + i * 40;
      drawCloud(cx, cy, 30 + i * 8);
    }

    // Distant hills
    ctx.fillStyle = '#95d5b2';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for (let x = 0; x <= W; x += 20) {
      const y = GROUND_Y - 40 - Math.sin((x + frame * 0.3) * 0.01) * 30;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, GROUND_Y);
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, r) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.arc(x + r * 0.8, y - r * 0.3, r * 0.8, 0, Math.PI * 2);
    ctx.arc(x - r * 0.8, y - r * 0.2, r * 0.7, 0, Math.PI * 2);
    ctx.arc(x + r * 0.3, y + r * 0.2, r * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawGround() {
    ctx.fillStyle = '#2d6a4f';
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
    ctx.fillStyle = '#40916c';
    ctx.fillRect(0, GROUND_Y, W, 6);

    // Moving dashes to show speed
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    const offset = (frame * speed * 0.5) % 40;
    for (let x = -offset; x < W; x += 40) {
      ctx.fillRect(x, GROUND_Y + 20, 20, 3);
    }
  }

  function drawPlayer() {
    const px = player.x;
    const py = player.y - player.h;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(px + player.w / 2, GROUND_Y + 4, player.w * 0.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = '#e63946';
    roundRect(px, py, player.w, player.h, 8);
    ctx.fill();

    // Face
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(px + player.w - 12, py + 14, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(px + player.w - 10, py + 14, 3, 0, Math.PI * 2);
    ctx.fill();

    // Little legs animation when on ground
    if (player.onGround) {
      const legSwing = Math.sin(frame * 0.4) * 4;
      ctx.strokeStyle = '#c1121f';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px + 10, py + player.h);
      ctx.lineTo(px + 10 + legSwing, py + player.h + 8);
      ctx.moveTo(px + player.w - 10, py + player.h);
      ctx.lineTo(px + player.w - 10 - legSwing, py + player.h + 8);
      ctx.stroke();
    }
  }

  function drawObstacles() {
    for (const o of obstacles) {
      ctx.fillStyle = o.color;
      roundRect(o.x, o.y, o.w, o.h, 6);
      ctx.fill();
      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.fillRect(o.x + 4, o.y + 4, o.w * 0.3, o.h - 8);
    }
  }

  function drawCoins() {
    for (const c of coins) {
      const wobble = Math.abs(Math.cos(c.spin)) * 0.6 + 0.4;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(wobble, 1);
      ctx.beginPath();
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd60a';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#e6a800';
      ctx.stroke();
      // Inner shine
      ctx.beginPath();
      ctx.arc(-2, -2, c.r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.fillStyle = '#1a1a2e';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('Score: ' + Math.floor(score), 20, 36);

    ctx.textAlign = 'right';
    ctx.fillText('Best: ' + bestScore, W - 20, 36);

    ctx.textAlign = 'left';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = '#e6a800';
    ctx.fillText('🪙 ' + coinsCollected, 20, 64);
  }

  function drawOverlay() {
    if (state === 'ready') {
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px system-ui, sans-serif';
      ctx.fillText('Coin Runner', W / 2, H / 2 - 40);

      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText('Press SPACE / tap to jump', W / 2, H / 2 + 10);
      ctx.fillText('Collect coins, dodge the blocks!', W / 2, H / 2 + 40);

      ctx.font = 'bold 24px system-ui, sans-serif';
      ctx.fillStyle = '#ffd60a';
      ctx.fillText('Press SPACE or TAP to Start', W / 2, H / 2 + 100);
    }

    if (state === 'over') {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, W, H);

      ctx.textAlign = 'center';
      ctx.fillStyle = '#e63946';
      ctx.font = 'bold 52px system-ui, sans-serif';
      ctx.fillText('Game Over', W / 2, H / 2 - 50);

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px system-ui, sans-serif';
      ctx.fillText('Score: ' + Math.floor(score), W / 2, H / 2 + 5);
      ctx.fillText('Coins: ' + coinsCollected, W / 2, H / 2 + 42);

      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText('Best: ' + bestScore, W / 2, H / 2 + 82);

      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = '#ffd60a';
      ctx.fillText('Press SPACE or TAP to Play Again', W / 2, H / 2 + 130);
    }
  }

  // ---------- Helpers ----------
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------- Main loop ----------
  function loop() {
    update();

    drawBackground();
    drawGround();
    drawObstacles();
    drawCoins();
    drawPlayer();
    drawParticles();
    drawHUD();
    drawOverlay();

    requestAnimationFrame(loop);
  }

  // ---------- Boot ----------
  reset();
  loop();
})();
</script>
</body>
</html>
